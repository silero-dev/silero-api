[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silero-api"
version = "0.1.0"
description = "Python client for Silero-style text-to-speech and speech-to-text through a hosted API on Synexa"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "silero-dev"}]
keywords = ["ai api", "mimo-tts", "silero", "silero api", "silero python", "synexa", "tts", "whisper-v3"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/silero-dev/silero-api"
Documentation = "https://silero-dev.github.io/silero-api/"
"Hosted model" = "https://synexa.ai/explore/xiaomi/mimo-tts?utm_source=github&utm_medium=ugc&utm_campaign=silero-dev&utm_content=pyproject&utm_term=tier-a"

[tool.setuptools.packages.find]
include = ["silero_api*"]
